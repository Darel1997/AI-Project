name: security-audit

# Runs on every push to main + every PR. Catches dependency CVEs and dead
# deps before they accumulate into a "we'll deal with it later" backlog.
#
# Save as .github/workflows/security-audit.yml in the repo root.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Run weekly even when there's no PR, in case new CVEs land against
    # pinned versions.
    - cron: "0 6 * * 1"

jobs:
  backend-deps:
    name: Backend deps (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit production deps
        working-directory: backend
        run: |
          # pip-audit reads requirements.txt directly — no need to install
          # the whole stack just to check it.
          pip-audit -r requirements.txt --strict
          # `--strict` exits non-zero on ANY known vulnerability. Loosen
          # to plain `pip-audit -r requirements.txt` if you want warn-only.

  frontend-deps:
    name: Frontend deps (npm audit + depcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: npm audit (high+ critical)
        working-directory: frontend
        # `--audit-level=high` ignores low/moderate. Most "moderate" vulns
        # in transitive dev deps don't actually reach production code, so
        # blocking on them creates audit fatigue. Tighten to `moderate`
        # once the codebase is calm.
        run: npm audit --audit-level=high
      - name: depcheck (unused dependencies)
        working-directory: frontend
        run: npx -y depcheck --skip-missing
        # `--skip-missing` reports unused but ignores missing — missing
        # deps are often false positives in Next.js (next/image, etc.)
        # which depcheck doesn't always recognize.

  python-static:
    name: Backend static analysis (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bandit
        run: python -m pip install bandit
      - name: Run bandit
        working-directory: backend
        # Bandit catches: SQL injection patterns, weak hash algorithms,
        # `subprocess` with shell=True, hardcoded passwords, insecure
        # tempfile usage, etc. -ll restricts to medium+ severity.
        run: bandit -r app -ll --exclude tests
