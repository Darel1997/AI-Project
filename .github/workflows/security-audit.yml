name: security-audit

# Runs on every push to main / master / development + every PR. Catches
# dependency CVEs and dead deps before they accumulate into a "we'll deal
# with it later" backlog.

on:
  push:
    branches: [main, master, development]
  pull_request:
  schedule:
    # Run weekly even when there's no PR, in case new CVEs land against
    # pinned versions.
    - cron: "0 6 * * 1"

# Don't cancel an in-progress audit when a new commit lands on a branch — let
# it finish so we capture historical results. But cancel pull-request runs
# since they get replaced as the PR evolves.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-deps:
    name: Backend deps (pip-audit)
    runs-on: ubuntu-latest
    # Don't fail the whole pipeline on CVEs — they need triage, not a hard
    # block on every developer. Findings still show up in the Actions log.
    # The 19 remaining transitive CVEs (transformers pinned by chromadb,
    # pyasn1 pinned by python-jose) can't be closed without invasive
    # upstream changes.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit production deps
        working-directory: backend
        run: |
          # pip-audit reads requirements.txt directly — no need to install
          # the whole stack just to check it. We don't use --strict here
          # so a transient new CVE doesn't block all PRs; review findings
          # in the Actions log and bump pins in a follow-up PR.
          pip-audit -r requirements.txt || true

  frontend-deps:
    name: Frontend deps (npm audit + depcheck)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          # NOTE: deliberately not caching npm here. Caching requires a
          # lock file (package-lock.json) for the cache key, and we
          # currently regenerate the lock file on every `npm install` to
          # tolerate package.json drift. When the lock file is committed
          # and stable, add back:
          #   cache: "npm"
          #   cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        # `npm install` instead of `npm ci`: more tolerant of lock-file drift
        # (which is inevitable when package.json changes), and on a CI box
        # there's nothing important to preserve about the exact lock state.
        # `--legacy-peer-deps` accepts mismatches between eslint-config-next's
        # required eslint version and the project's pinned eslint version
        # (benign at lint time).
        # `--no-audit` skips an auto-audit that would noisy up the log; we
        # run audit explicitly in the next step.
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: npm audit (high+ critical)
        working-directory: frontend
        # `--audit-level=high` ignores low/moderate. Most "moderate" vulns
        # in transitive dev deps don't actually reach production code, so
        # blocking on them creates audit fatigue. Tighten to `moderate`
        # once the codebase is calm.
        run: npm audit --audit-level=high || true
      - name: depcheck (unused dependencies)
        working-directory: frontend
        # `--skip-missing` reports unused but ignores missing — missing
        # deps are often false positives in Next.js (next/image, etc.)
        # which depcheck doesn't always recognize.
        run: npx -y depcheck --skip-missing || true

  python-static:
    name: Backend static analysis (bandit)
    runs-on: ubuntu-latest
    # This one stays strict — bandit findings are code issues we wrote
    # ourselves, much firmer signal than third-party CVE noise.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bandit
        run: python -m pip install bandit
      - name: Run bandit
        working-directory: backend
        # `-ll` restricts to medium+ severity. The MD5 hit in
        # embedding_service.py is flagged with usedforsecurity=False so
        # bandit no longer trips on it.
        run: bandit -r app -ll --exclude tests
