name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # No cache config — setup-node refuses to start when the
          # cache-dependency-path doesn't exist, and we currently let
          # `npm install` regenerate package-lock.json on the fly to
          # tolerate package.json drift. When the lock file is committed
          # and stable, add back:
          #   cache: npm
          #   cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # `npm ci` first because it's the strict/reproducible path when the
        # lock file exists. Falls through to `npm install` when the lock is
        # missing or out of sync with package.json — common right now while
        # the audit shake-out is settling. `--no-audit --no-fund` cuts log
        # noise; we audit separately in security-audit.yml.
        run: npm ci --legacy-peer-deps --no-audit --no-fund || npm install --legacy-peer-deps --no-audit --no-fund

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://repoinsight.ai

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: lint-and-build
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # See note in lint-and-build above.

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund || npm install --legacy-peer-deps --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Start app
        run: npm start &
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run Playwright tests
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
